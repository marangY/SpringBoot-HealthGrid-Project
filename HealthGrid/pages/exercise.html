<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운동 관리 - 헬스그리드</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .rec-card {
      padding: var(--space-md);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
      transition: all var(--duration-fast) ease;
    }
    .rec-card:hover {
      background: var(--color-bg-subtle);
      border-color: var(--teal-200);
    }

    .rec-info { flex: 1; }
    .rec-name { font-weight: 600; margin-bottom: 2px; }
    .rec-desc { font-size: 0.8rem; color: var(--color-text-secondary); line-height: 1.5; }
    .rec-meta { display: flex; gap: var(--space-md); margin-top: var(--space-sm); font-size: 0.75rem; }
    .rec-meta span { display: inline-flex; align-items: center; gap: 3px; color: var(--color-text-muted); }
    .log-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }
    .log-item:last-child { border-bottom: none; }
    .log-num { width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--teal-50); color: var(--teal-700); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout"></div>

  <script src="../js/app.js"></script>
  <script>
    const user = Store.get('user') || DUMMY_USER;

    // Recommended exercises based on user profile
    const recommendations = [
      { name: '조깅 / 러닝', desc: '체지방 감량에 효과적인 유산소 운동입니다. 주 3~4회, 30분 이상 권장합니다.', time: '30~45분', cal: '250~350 kcal', difficulty: '초급' },
      { name: '바벨 스쿼트', desc: '하체 근력 강화의 기본 운동입니다. 올바른 자세로 4세트 × 10회 수행하세요.', time: '20분', cal: '150~200 kcal', difficulty: '중급' },
      { name: '벤치프레스', desc: '가슴과 삼두근을 발달시키는 복합 운동입니다. 점진적으로 무게를 늘려보세요.', time: '20분', cal: '100~150 kcal', difficulty: '중급' },
      { name: '실내 사이클링', desc: '관절에 부담이 적으면서 높은 칼로리 소모가 가능한 유산소 운동입니다.', time: '30~40분', cal: '300~400 kcal', difficulty: '초급' },
      { name: '요가 / 스트레칭', desc: '유연성 향상과 근육 회복에 도움이 됩니다. 운동 전후로 수행하세요.', time: '20~30분', cal: '80~120 kcal', difficulty: '초급' },
      { name: '버피 테스트', desc: '전신 근력과 심폐 지구력을 동시에 향상시키는 고강도 운동입니다.', time: '15분', cal: '150~200 kcal', difficulty: '고급' },
      { name: '수영', desc: '전신 운동으로 관절 부담 없이 높은 칼로리를 소모할 수 있습니다.', time: '40~60분', cal: '350~500 kcal', difficulty: '중급' },
      { name: '줄넘기', desc: '짧은 시간에 높은 칼로리를 소모하는 효율적인 유산소 운동입니다.', time: '15~20분', cal: '200~300 kcal', difficulty: '초급' },
    ];

    // Today's exercise log
    const todayLog = [
      { name: '러닝', detail: '30분, 5.2km 달림', cal: 280 },
      { name: '벤치프레스', detail: '4세트 × 10회, 60kg', cal: 90 },
      { name: '스트레칭', detail: '15분 전신 스트레칭', cal: 50 },
    ];

    const dailyTargetCal = 600; // 운동 소모 목표
    const todayBurned = todayLog.reduce((s, e) => s + e.cal, 0);
    const achievePercent = Math.min(Math.round((todayBurned / dailyTargetCal) * 100), 100);

    document.getElementById('appLayout').innerHTML = renderSidebar('exercise') + `
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>운동 관리</h1>
          <p class="text-sm text-muted">맞춤 운동 추천과 칼로리 소모를 추적하세요</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary btn-sm" onclick="openModal('logExerciseModal')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            운동 기록
          </button>
        </div>
      </header>

      <div class="page-body">
        <!-- Today's Progress -->
        <div class="grid grid-3 mb-lg stagger">
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:var(--teal-50); color:var(--teal-600);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <div class="stat-value" data-count="${todayBurned}">0</div>
            <div class="stat-label">오늘 소모 칼로리 (kcal)</div>
          </div>
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:var(--green-50); color:var(--green-600);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-value">${todayLog.length}회</div>
            <div class="stat-label">오늘 운동 횟수</div>
          </div>
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:#fefce8; color:#ca8a04;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="stat-value">${achievePercent}%</div>
            <div class="stat-label">목표 달성률</div>
          </div>
        </div>

        <div class="grid grid-2 mb-lg">
          <!-- Calorie Burn Progress -->
          <div class="card animate-fade-in-up">
            <div class="card-header">
              <div class="card-title">오늘의 운동 소모량</div>
              <span class="badge ${achievePercent >= 100 ? 'badge-success' : 'badge-primary'}">${achievePercent >= 100 ? '목표 달성!' : '진행 중'}</span>
            </div>
            <div style="display:flex; align-items:center; gap:var(--space-xl); margin-bottom:var(--space-lg);">
              <div class="circular-progress" style="width:140px; height:140px;">
                <svg width="140" height="140" viewBox="0 0 140 140">
                  <circle cx="70" cy="70" r="60" fill="none" stroke="var(--color-bg-muted)" stroke-width="12"/>
                  <circle cx="70" cy="70" r="60" fill="none" stroke="url(#exGrad)" stroke-width="12" stroke-linecap="round"
                    stroke-dasharray="${2 * Math.PI * 60}" stroke-dashoffset="${2 * Math.PI * 60 * (1 - achievePercent / 100)}" style="transition:stroke-dashoffset 1s ease;"/>
                  <defs>
                    <linearGradient id="exGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="var(--teal-500)"/>
                      <stop offset="100%" stop-color="var(--green-400)"/>
                    </linearGradient>
                  </defs>
                </svg>
                <div class="progress-text">
                  <div class="progress-value" style="font-size:1.6rem;">${achievePercent}%</div>
                  <div class="progress-label">달성률</div>
                </div>
              </div>
              <div class="flex-col gap-md" style="flex:1;">
                <div>
                  <div class="text-sm text-muted">소모 칼로리</div>
                  <div class="font-bold" style="font-size:1.5rem;">${todayBurned} <span class="text-sm font-medium text-muted">/ ${dailyTargetCal} kcal</span></div>
                </div>
                <div class="progress-bar" style="height:8px;">
                  <div class="progress-fill" style="width:${achievePercent}%;"></div>
                </div>
                <div class="text-sm text-muted">남은 소모량: <strong>${Math.max(dailyTargetCal - todayBurned, 0)} kcal</strong></div>
              </div>
            </div>
          </div>

          <!-- Today's Exercise Log -->
          <div class="card animate-fade-in-up">
            <div class="card-header">
              <div class="card-title">오늘 운동 기록</div>
            </div>
            <div>
              ${todayLog.map((e, i) => `
                <div class="log-item">
                  <div class="log-num">${i + 1}</div>
                  <div style="flex:1;">
                    <div class="font-semibold" style="font-size:0.95rem;">${e.name}</div>
                    <div class="text-sm text-muted">${e.detail}</div>
                  </div>
                  <div class="font-bold text-primary">${e.cal} kcal</div>
                </div>
              `).join('')}
            </div>
            <div style="margin-top:var(--space-md); padding-top:var(--space-md); border-top:1px solid var(--color-border-light); display:flex; justify-content:space-between; align-items:center;">
              <span class="text-sm text-muted">총 소모 칼로리</span>
              <span class="font-bold" style="font-size:1.1rem; color:var(--color-primary);">${todayBurned} kcal</span>
            </div>
          </div>
        </div>

        <!-- Exercise Recommendations -->
        <div class="card animate-fade-in-up">
          <div class="card-header">
            <div>
              <div class="card-title">맞춤 운동 추천</div>
              <div class="card-subtitle">${user.name || '김건강'}님의 체형과 목표에 맞는 운동입니다</div>
            </div>
            <span class="badge badge-primary">AI 추천</span>
          </div>
          <div style="padding:var(--space-sm) var(--space-md); background:var(--color-bg-subtle); border-radius:var(--radius-md); margin-bottom:var(--space-lg); font-size:0.85rem; color:var(--color-text-secondary); line-height:1.6;">
            <strong style="color:var(--color-text);">추천 근거:</strong>
            나이 ${user.age}세, 키 ${user.height}cm, 체중 ${user.weight}kg 기준.
            목표 체중 ${user.targetWeight}kg (${user.weight - user.targetWeight}kg 감량), 근육량 ${user.muscleGoal === 'gain' ? '증량' : '유지'} 목표.
            유산소와 근력 운동을 균형 있게 병행하는 것을 추천합니다.
          </div>
          <div class="grid grid-2 gap-md">
            ${recommendations.map(r => `
              <div class="rec-card">

                <div class="rec-info">
                  <div class="rec-name">${r.name}</div>
                  <div class="rec-desc">${r.desc}</div>
                  <div class="rec-meta">
                    <span>${r.time}</span>
                    <span>${r.cal}</span>
                    <span>${r.difficulty}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </main>

    <!-- Log Exercise Modal -->
    <div class="modal-overlay" id="logExerciseModal">
      <div class="modal" style="max-width:520px;">
        <div class="modal-header">
          <h3>운동 기록하기</h3>
          <div class="modal-close" onclick="closeModal('logExerciseModal')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
        </div>
        <form onsubmit="handleExerciseLog(event)">
          <div class="form-group">
            <label class="form-label">운동 내용</label>
            <textarea class="form-textarea" id="exerciseText" placeholder="예: 러닝 30분 5km, 벤치프레스 4세트 10회 60kg, 플랭크 3세트 1분" rows="4" required></textarea>
            <p class="form-hint">시행한 운동과 횟수, 시간 등을 자유롭게 입력하세요.</p>
          </div>

          <div style="display:flex; gap:var(--space-sm);">
            <button type="submit" class="btn btn-primary" style="width:100%;">기록 저장</button>
          </div>
        </form>
      </div>
    </div>
    `;

    initSidebar();
    initNavHighlight();

    // Animate count-up
    document.querySelectorAll('[data-count]').forEach(el => {
      animateCountUp(el, parseInt(el.dataset.count));
    });



    function handleExerciseLog(e) {
      e.preventDefault();
      showToast('운동 기록이 저장되었습니다!', 'success');
      closeModal('logExerciseModal');
    }
    window.handleExerciseLog = handleExerciseLog;
  </script>
</body>
</html>
