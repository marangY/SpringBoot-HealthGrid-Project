<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>체형 정보 - 헬스그리드</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout" id="appLayout"></div>

  <script src="../js/app.js"></script>
  <script>
    const user = Store.get('user') || DUMMY_USER;

    document.getElementById('appLayout').innerHTML = renderSidebar('profile') + `
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>체형 및 건강 정보</h1>
          <p class="text-sm text-muted">나의 신체 정보와 목표를 관리하세요</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary btn-sm" onclick="openModal('editProfileModal')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            정보 수정
          </button>
        </div>
      </header>

      <div class="page-body">
        <!-- Current Body Info -->
        <div class="grid grid-4 mb-lg stagger">
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:var(--teal-50); color:var(--teal-600);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="stat-label">성별</div>
            <div class="stat-value" style="font-size:1.4rem;" id="displayGender">남성</div>
          </div>
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:var(--green-50); color:var(--green-600);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-label">나이</div>
            <div class="stat-value" style="font-size:1.4rem;" id="displayAge">${user.age}세</div>
          </div>
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:#eff6ff; color:#2563eb;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
            </div>
            <div class="stat-label">키</div>
            <div class="stat-value" style="font-size:1.4rem;" id="displayHeight">${user.height}cm</div>
          </div>
          <div class="card stat-card animate-fade-in-up">
            <div class="stat-icon" style="background:#fefce8; color:#ca8a04;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <div class="stat-label">현재 체중</div>
            <div class="stat-value" style="font-size:1.4rem;" id="displayWeight">${user.weight}kg</div>
          </div>
        </div>

        <div class="grid grid-2 mb-lg">
          <!-- BMI Card -->
          <div class="card animate-fade-in-up">
            <div class="card-header">
              <div class="card-title">BMI 분석</div>
              <span class="badge badge-success" id="bmiStatus">정상</span>
            </div>
            <div style="text-align:center; padding:var(--space-lg) 0;">
              <div style="font-size:3rem; font-weight:700; color:var(--color-primary);" id="bmiValue">23.5</div>
              <div class="text-sm text-muted mt-sm">체질량지수 (BMI)</div>
            </div>
            <!-- BMI Scale -->
            <div style="position:relative; height:32px; margin:var(--space-lg) 0 var(--space-sm);">
              <div style="display:flex; height:8px; border-radius:var(--radius-full); overflow:hidden;">
                <div style="flex:1; background:#3b82f6;"></div>
                <div style="flex:1; background:#22c55e;"></div>
                <div style="flex:1; background:#f59e0b;"></div>
                <div style="flex:1; background:#ef4444;"></div>
              </div>
              <div id="bmiIndicator" style="position:absolute; top:-4px; width:16px; height:16px; background:#fff; border:3px solid var(--color-primary); border-radius:50%; transform:translateX(-50%); transition:left 0.6s ease; left:42%;">
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--color-text-muted);">
              <span>저체중<br>&lt;18.5</span>
              <span>정상<br>18.5-24.9</span>
              <span>과체중<br>25-29.9</span>
              <span>비만<br>≥30</span>
            </div>
          </div>

          <!-- Goal Settings -->
          <div class="card animate-fade-in-up">
            <div class="card-header">
              <div class="card-title">목표 설정</div>
              <button class="btn btn-sm btn-secondary" onclick="openModal('editGoalModal')">수정</button>
            </div>

            <div class="flex-col gap-lg">
              <!-- Weight Goal -->
              <div>
                <div class="flex-row justify-between mb-sm">
                  <span class="text-sm font-medium">목표 체중</span>
                  <span class="font-bold text-primary" id="displayTargetWeight">${user.targetWeight}kg</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" id="weightProgress" style="width:0%;"></div>
                </div>
                <div class="flex-row justify-between mt-sm">
                  <span class="text-xs text-muted">현재 ${user.weight}kg</span>
                  <span class="text-xs text-muted">남은 ${user.weight - user.targetWeight}kg</span>
                </div>
              </div>

              <!-- Muscle Goal -->
              <div>
                <div class="flex-row justify-between mb-sm">
                  <span class="text-sm font-medium">근육량 목표</span>
                  <span class="badge badge-primary" id="displayMuscleGoal">유지</span>
                </div>
                <p class="text-sm text-muted">현재 근육량을 유지하면서 체지방을 감량하는 것을 목표로 합니다.</p>
              </div>

              <!-- Daily Calorie Target -->
              <div>
                <div class="flex-row justify-between mb-sm">
                  <span class="text-sm font-medium">일일 목표 칼로리</span>
                  <span class="font-bold" id="displayTargetCal">${user.targetCalories} kcal</span>
                </div>
                <div class="flex-row gap-md" style="flex-wrap:wrap;">
                  <div style="flex:1; min-width:100px; padding:var(--space-sm) var(--space-md); background:var(--teal-50); border-radius:var(--radius-sm); text-align:center;">
                    <div class="text-xs text-muted">탄수화물</div>
                    <div class="font-semibold">275g</div>
                    <div class="text-xs text-muted">50%</div>
                  </div>
                  <div style="flex:1; min-width:100px; padding:var(--space-sm) var(--space-md); background:var(--green-50); border-radius:var(--radius-sm); text-align:center;">
                    <div class="text-xs text-muted">단백질</div>
                    <div class="font-semibold">137g</div>
                    <div class="text-xs text-muted">25%</div>
                  </div>
                  <div style="flex:1; min-width:100px; padding:var(--space-sm) var(--space-md); background:#fefce8; border-radius:var(--radius-sm); text-align:center;">
                    <div class="text-xs text-muted">지방</div>
                    <div class="font-semibold">61g</div>
                    <div class="text-xs text-muted">25%</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
      <div class="modal">
        <div class="modal-header">
          <h3>신체 정보 수정</h3>
          <div class="modal-close" onclick="closeModal('editProfileModal')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
        </div>
        <form onsubmit="handleProfileUpdate(event)">
          <div class="form-group">
            <label class="form-label">성별</label>
            <select class="form-select" id="editGender">
              <option value="male" selected>남성</option>
              <option value="female">여성</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">나이</label>
            <input type="number" class="form-input" id="editAge" value="${user.age}" min="10" max="100">
          </div>
          <div class="form-group">
            <label class="form-label">키 (cm)</label>
            <input type="number" class="form-input" id="editHeight" value="${user.height}" min="100" max="250" step="0.1">
          </div>
          <div class="form-group">
            <label class="form-label">현재 체중 (kg)</label>
            <input type="number" class="form-input" id="editWeight" value="${user.weight}" min="30" max="300" step="0.1">
          </div>
          <div style="display:flex; gap:var(--space-sm); justify-content:flex-end;">
            <button type="button" class="btn btn-outline" onclick="closeModal('editProfileModal')">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Goal Modal -->
    <div class="modal-overlay" id="editGoalModal">
      <div class="modal">
        <div class="modal-header">
          <h3>목표 설정 수정</h3>
          <div class="modal-close" onclick="closeModal('editGoalModal')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
        </div>
        <form onsubmit="handleGoalUpdate(event)">
          <div class="form-group">
            <label class="form-label">목표 체중 (kg)</label>
            <input type="number" class="form-input" id="editTargetWeight" value="${user.targetWeight}" min="30" max="200" step="0.1">
            <p class="form-hint">현재 체중: ${user.weight}kg</p>
          </div>
          <div class="form-group">
            <label class="form-label">근육량 목표</label>
            <select class="form-select" id="editMuscleGoal">
              <option value="maintain" selected>유지 — 현재 근육량 유지</option>
              <option value="gain">증량 — 근육량 늘리기</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">일일 목표 칼로리 (kcal)</label>
            <input type="number" class="form-input" id="editTargetCal" value="${user.targetCalories}" min="1000" max="5000" step="50">
            <p class="form-hint">기초대사량 기반 권장: 2,100 ~ 2,400 kcal</p>
          </div>

          <div style="display:flex; gap:var(--space-sm); justify-content:flex-end;">
            <button type="button" class="btn btn-outline" onclick="closeModal('editGoalModal')">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>
    `;

    initSidebar();
    initNavHighlight();

    // BMI calculation
    const bmi = (user.weight / ((user.height / 100) ** 2)).toFixed(1);
    document.getElementById('bmiValue').textContent = bmi;
    const bmiNum = parseFloat(bmi);
    let bmiPercent = 0;
    if (bmiNum < 18.5) { bmiPercent = (bmiNum / 18.5) * 25; document.getElementById('bmiStatus').textContent = '저체중'; document.getElementById('bmiStatus').className = 'badge badge-warning'; }
    else if (bmiNum < 25) { bmiPercent = 25 + ((bmiNum - 18.5) / 6.5) * 25; }
    else if (bmiNum < 30) { bmiPercent = 50 + ((bmiNum - 25) / 5) * 25; document.getElementById('bmiStatus').textContent = '과체중'; document.getElementById('bmiStatus').className = 'badge badge-warning'; }
    else { bmiPercent = 75 + Math.min(((bmiNum - 30) / 10) * 25, 25); document.getElementById('bmiStatus').textContent = '비만'; document.getElementById('bmiStatus').className = 'badge badge-danger'; }
    document.getElementById('bmiIndicator').style.left = bmiPercent + '%';

    // Weight progress
    const totalLoss = user.weight - user.targetWeight;
    const currentLoss = 0.5 * 4; // simulated 4 weeks
    const progressPercent = Math.min((currentLoss / totalLoss) * 100, 100);
    setTimeout(() => {
      document.getElementById('weightProgress').style.width = progressPercent + '%';
    }, 300);



    function handleProfileUpdate(e) {
      e.preventDefault();
      user.gender = document.getElementById('editGender').value;
      user.age = parseInt(document.getElementById('editAge').value);
      user.height = parseFloat(document.getElementById('editHeight').value);
      user.weight = parseFloat(document.getElementById('editWeight').value);
      Store.set('user', user);
      closeModal('editProfileModal');
      showToast('신체 정보가 업데이트되었습니다.', 'success');
      setTimeout(() => location.reload(), 800);
    }

    function handleGoalUpdate(e) {
      e.preventDefault();
      user.targetWeight = parseFloat(document.getElementById('editTargetWeight').value);
      user.muscleGoal = document.getElementById('editMuscleGoal').value;
      user.targetCalories = parseInt(document.getElementById('editTargetCal').value);
      Store.set('user', user);
      closeModal('editGoalModal');
      showToast('목표가 업데이트되었습니다.', 'success');
      setTimeout(() => location.reload(), 800);
    }
  </script>
</body>
</html>
